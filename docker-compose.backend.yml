version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sannetic-postgres
    environment:
      POSTGRES_DB: sannetic_explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sannetic_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - sannetic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sannetic_explorer"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (for caching and background tasks)
  redis:
    image: redis:7-alpine
    container_name: sannetic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sannetic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sannetic-backend
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sannetic_explorer
      DB_USER: postgres
      DB_PASSWORD: sannetic_password
      DB_ECHO: "false"
      
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # API configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "true"
      
      # CORS configuration
      CORS_ORIGINS: "*"
      
      # Logging
      LOG_LEVEL: INFO
      
      # Optional: AI configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini
      
      # Optional: External API keys
      N2YO_API_KEY: ${N2YO_API_KEY:-}
      SPACE_TRACK_USERNAME: ${SPACE_TRACK_USERNAME:-}
      SPACE_TRACK_PASSWORD: ${SPACE_TRACK_PASSWORD:-}
    volumes:
      - .:/app
      - ./Data:/app/Data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sannetic-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker (for background tasks)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sannetic-celery-worker
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sannetic_explorer
      DB_USER: postgres
      DB_PASSWORD: sannetic_password
      
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Celery configuration
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # Logging
      LOG_LEVEL: INFO
    volumes:
      - .:/app
      - ./Data:/app/Data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sannetic-network
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sannetic-celery-beat
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sannetic_explorer
      DB_USER: postgres
      DB_PASSWORD: sannetic_password
      
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Celery configuration
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # Logging
      LOG_LEVEL: INFO
    volumes:
      - .:/app
      - ./Data:/app/Data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sannetic-network
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info

  # Flower (Celery monitoring)
  flower:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sannetic-flower
    environment:
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Celery configuration
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sannetic-network
    restart: unless-stopped
    command: celery -A app.celery flower --port=5555

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sannetic-network:
    driver: bridge 