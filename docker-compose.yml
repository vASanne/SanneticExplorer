services:
  db:
    image: postgres:16
    env_file: .env
    volumes: 
      - "pgdata:/var/lib/postgresql/data"
    environment:
      POSTGRES_DB: sannetic_explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    depends_on: 
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: 
      - "8000:8000"
    volumes:
      - ./Data:/app/Data:ro
      - ./logs:/app/logs
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sannetic_explorer
      PUBLIC_API_URL: http://localhost:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    depends_on: 
      backend:
        condition: service_healthy
    ports: 
      - "3000:3000"
    environment:
      PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Data:/data:rw
      - ./logs:/var/log
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sannetic_explorer
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - default

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    driver: bridge 