name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    outputs:
      changelog: ${{ steps.changelog.outputs.clean_changelog }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}"

      - name: Generate changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-message: 'chore(release): {version}'
          preset: 'angular'
          tag-prefix: 'v'
          output-file: 'CHANGELOG.md'
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          release-count: 0
          config-file: '.versionrc'

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: backend
            dockerfile: Dockerfile.backend
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: ./frontend
          - name: worker
            dockerfile: Dockerfile.worker
            context: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Update CHANGELOG.md
        if: matrix.image.name == 'backend'
        run: |
          echo "## Docker Images" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "The following Docker images have been published to GHCR:" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "- \`ghcr.io/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}\`" >> CHANGELOG.md
          echo "- \`ghcr.io/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}\`" >> CHANGELOG.md
          echo "- \`ghcr.io/${{ env.IMAGE_NAME }}-worker:${{ steps.version.outputs.version }}\`" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [release, build-and-push]
    if: always() && secrets.SLACK_WEBHOOK_URL
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#releases'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            🚀 **Sannetic Explorer ${{ steps.version.outputs.version }} Released!**
            
            📦 Docker images published to GHCR:
            • `ghcr.io/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}`
            • `ghcr.io/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}`
            • `ghcr.io/${{ env.IMAGE_NAME }}-worker:${{ steps.version.outputs.version }}`
            
            📋 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }})
            📊 [View Changes](https://github.com/${{ github.repository }}/compare/v${{ steps.version.outputs.version }}...main)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  update-release:
    name: Update Release with Docker Info
    runs-on: ubuntu-latest
    needs: [release, build-and-push]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update release with Docker images
        run: |
          # Get the release body
          RELEASE_BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.version }}" | \
            jq -r '.body')
          
          # Add Docker images section
          DOCKER_SECTION="
          
          ## 🐳 Docker Images
          
          The following Docker images have been published to GitHub Container Registry:
          
          - **Backend**: \`ghcr.io/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}\`
          - **Frontend**: \`ghcr.io/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}\`
          - **Worker**: \`ghcr.io/${{ env.IMAGE_NAME }}-worker:${{ steps.version.outputs.version }}\`
          
          ### Quick Start
          
          \`\`\`bash
          # Pull and run the latest release
          docker pull ghcr.io/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}
          docker pull ghcr.io/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}
          docker pull ghcr.io/${{ env.IMAGE_NAME }}-worker:${{ steps.version.outputs.version }}
          \`\`\`"
          
          # Update the release
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.version }}" \
            -d "{\"body\":\"$RELEASE_BODY$DOCKER_SECTION\"}" 