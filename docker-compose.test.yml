# Test stack. Own project name and host ports so it can run beside the main stack
# without sharing volumes or binding 3000/8000/5432/6379.
name: ${COMPOSE_PROJECT_NAME:-sannetic-explorer-test}

version: '3.8'

services:
  # Test Database
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sannetic_explorer_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${HOST_TEST_POSTGRES_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - test_pgdata:/var/lib/postgresql/data

  # Test Redis
  test-redis:
    image: redis:7-alpine
    ports:
      - "${HOST_TEST_REDIS_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - test_redis_data:/data

  # Test Backend
  test-backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@test-db:5432/sannetic_explorer_test
      REDIS_HOST: test-redis
      REDIS_PORT: 6379
      PUBLIC_API_URL: ${PUBLIC_TEST_API_URL:-http://localhost:13801}
      CORS_ORIGINS: ${TEST_CORS_ORIGINS:-http://localhost:13301,http://localhost:3001}
      LOG_LEVEL: DEBUG
      DEBUG_MODE: true
    depends_on: 
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    ports: 
      - "${HOST_TEST_BACKEND_PORT:-13801}:8000"
    volumes:
      - ./Data:/app/Data:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Test Frontend
  test-frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_TEST_API_URL:-http://localhost:13801}
        VITE_API_URL: ${PUBLIC_TEST_API_URL:-http://localhost:13801}
    environment:
      PUBLIC_API_URL: ${PUBLIC_TEST_API_URL:-http://localhost:13801}
      VITE_API_URL: ${PUBLIC_TEST_API_URL:-http://localhost:13801}
    depends_on: 
      test-backend:
        condition: service_healthy
    ports: 
      - "${HOST_TEST_FRONTEND_PORT:-13301}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static

  # Test Worker
  test-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@test-db:5432/sannetic_explorer_test
      REDIS_HOST: test-redis
      REDIS_PORT: 6379
      LOG_LEVEL: DEBUG
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    volumes:
      - ./Data:/data:rw
      - ./logs:/var/log

volumes:
  test_pgdata:
    driver: local
  test_redis_data:
    driver: local 